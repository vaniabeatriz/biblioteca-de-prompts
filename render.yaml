services:
  - type: web
    name: prompt-library-website
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build && npm run render:predeploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
