name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://prompt_library:prompt_library@localhost:5432/prompt_library_test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-and-test:
    name: Lint, Vitest, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run unit, integration, and contract tests
        run: npm test

      - name: Run production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prompt_library
          POSTGRES_PASSWORD: prompt_library
          POSTGRES_DB: prompt_library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompt_library -d prompt_library_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed database
        run: npm run seed

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
